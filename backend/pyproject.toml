[project]
name = "backend"
version = "0.1.0"
description = "A FastAPI + LangChain project for LLM applications"
requires-python = ">=3.12"
authors = [
    { name = "Group 9" }
]
dependencies = [
    "python-dotenv~=1.2.2",
    "SQLAlchemy~=2.0.48",
    "langchain-core~=1.2.17",
    "aiofiles~=25.1.0",
    "langchain-text-splitters~=1.1.1",
    "fastapi~=0.123.0",
    "starlette~=0.50.0",
    "pydantic-settings~=2.13.1",
    "langchain-community~=0.4.1",
    "python-jose~=3.5.0",
    "PyYAML~=6.0.3",
    "pydantic~=2.12.5",
    "requests~=2.32.5",
    "uvicorn>=0.23.1",
    "aiomysql>=0.3.2",
    "redis>=7.3.0",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.11",
    "openai>=1.0.0",
    "langchain-chroma>=1.1.0",
    "python-multipart>=0.0.22",
    "dashscope>=1.25.14",
    "pypdf>=6.9.2",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "langchain-dashscope>=0.1.8",
    "unstructured>=0.22.20",
    "markdown>=3.10",
    "python-pptx>=1.0.2",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pillow>=12.0.0",
    "langsmith>=0.7.22",
    "langgraph-cli[inmem]>=0.1.54",
    "apscheduler>=3.10.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "langchain-milvus~=0.3.3",
    "pymilvus~=2.6.14",
    "langgraph>=1.1.6",
    "aiosqlite>=0.22.1",
    "langchain-deepseek>=1.0.1",
    "mcp>=1.12.4",
    "langchain-mcp-adapters>=0.1.0",
    "google-api-python-client>=2.180.0",
    "google-auth>=2.40.0",
    "google-auth-oauthlib>=1.2.0",
    "pysocks>=1.7.1",
    "minio>=7.2.18",
    "docx2txt>=0.9",
]

# 开发依赖
[project.optional-dependencies]
local-models = [
    "sentence-transformers>=5.3.0",
    "modelscope>=1.35.3",
    "accelerate>=1.13.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "isort>=5.12.0",
    "ruff>=0.3.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv]
index-url = "https://pypi.org/simple"
