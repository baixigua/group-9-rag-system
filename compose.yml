name: ${COMPOSE_PROJECT_NAME:-rag-platform}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT_HOST:-3307}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio:
    # 官方社区镜像已停止发布；此镜像由未修改的 AGPLv3 社区源码构建。
    image: soldevelo/minio@sha256:1b02c5747d97e68fb46e740d771c454391d79d985e4fa5051dbb240ccad1dc85
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 15
    logging: *default-logging

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - ./data/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *default-logging

  milvus:
    image: milvusdb/milvus:v2.5.0
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: milvus-bucket
    volumes:
      - ./data/milvus:/var/lib/milvus
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *default-logging

  attu:
    image: zilliz/attu:v2.5
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "127.0.0.1:${ATTU_PORT:-8080}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    logging: *default-logging

  django:
    build:
      context: ./DjangoUserService
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,django,frontend
      DB_NAME: user_service
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_HOST: mysql
      DB_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:${DJANGO_PORT:-8001}:8001"
    volumes:
      - ./data/django-media:/app/media
      - ./log/django:/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      LLM_TYPE: ALIYUN
      EMBED_MODEL_TYPE: ALIYUN
      RERANKER_TYPE: ALIYUN
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_BASE_URL: ${ALIYUN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      CHAT_MODEL_NAME: ${CHAT_MODEL_NAME:-qwen-plus}
      ALIYUN_EMBED_MODEL_NAME: ${ALIYUN_EMBED_MODEL_NAME:-text-embedding-v4}
      ALIYUN_RERANKER_MODEL_NAME: ${ALIYUN_RERANKER_MODEL_NAME:-qwen3-vl-rerank}
      HTTP_PROXY: ${OUTBOUND_PROXY:-}
      HTTPS_PROXY: ${OUTBOUND_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,mysql,redis,minio,milvus,etcd,django,frontend
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: chat_history
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "3"
      REDIS_BLACKLIST_URL: redis://redis:6379/1
      VECTOR_STORE_BACKEND: milvus
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      DJANGO_API_URL: http://django:8001
      SECRET_KEY: ${JWT_SECRET_KEY}
      ALGORITHM: HS256
      OBJECT_STORAGE_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_DOCUMENTS_BUCKET: rag-documents
      MINIO_SECURE: "false"
      AGENT_ENGINE: graph
      MCP_ENABLED: "false"
      LANGCHAIN_TRACING_V2: "false"
      LOG_DIR: /logs
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./log/backend:/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *default-logging

  frontend:
    build:
      context: ./front
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONT_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${PORTAINER_PORT:-9443}:9443"
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    logging: *default-logging

